<text x="115" y="187">Solo lectura</text><text x="327" y="187">Comparar objetivos</text><text x="539" y="187">Alcance y reversión</text><text x="751" y="187">Cambio autorizado</text><text x="963" y="187">Evidencia posterior</text>
