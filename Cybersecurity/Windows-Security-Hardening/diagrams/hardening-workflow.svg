<rect width="1080" height="82" rx="18" fill="#14283F"/><rect y="55" width="1080" height="27" fill="#14283F"/>
<text x="34" y="37" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">SEGURIDAD DE WINDOWS</text>
<text x="34" y="62" fill="#D1FAE5" font-family="Arial,sans-serif" font-size="13">Línea base → evaluación → propuesta → autorización → validación</text>
<g font-family="Arial,sans-serif">
