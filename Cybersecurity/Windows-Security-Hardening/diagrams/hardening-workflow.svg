<text x="115" y="157">01 · BASE</text><text x="327" y="157">02 · EVALUAR</text><text x="539" y="157">03 · PROPONER</text><text x="751" y="157">04 · AUTORIZAR</text><text x="963" y="157">05 · VALIDAR</text>
</g>
