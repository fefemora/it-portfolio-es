<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Hoja de ruta de tratamiento a 90 días</title>
<desc id="svg-desc">Acciones propuestas por fases para riesgos críticos, altos y moderados; no se han ejecutado controles.</desc><rect width="1200" height="700" fill="#F5F7F8"/><rect width="1200" height="110" fill="#14283F"/><rect width="14" height="110" fill="#059669"/><g font-family="Arial,Helvetica,sans-serif"><text x="42" y="43" font-size="19" fill="#A7F3D0">EMERALD TECHNOLOGIES / CASO FICTICIO</text><text x="42" y="86" font-size="35" font-weight="bold" fill="#FFFFFF">Plan de tratamiento: 90 días</text><rect x="40" y="137" width="340" height="120" rx="12" fill="white" stroke="#D7E0E5"/><rect x="40" y="137" width="340" height="7" fill="#14283F"/><text x="60" y="209" font-size="50" font-weight="bold" fill="#14283F">8</text><text x="150" y="205" font-size="21" font-weight="bold" fill="#14283F">Riesgos a tratar</text><rect x="430" y="137" width="340" height="120" rx="12" fill="white" stroke="#D7E0E5"/><rect x="430" y="137" width="340" height="7" fill="#DC3545"/><text x="450" y="209" font-size="50" font-weight="bold" fill="#DC3545">2</text><text x="540" y="205" font-size="21" font-weight="bold" fill="#14283F">Prioridades críticas</text><rect x="820" y="137" width="340" height="120" rx="12" fill="white" stroke="#D7E0E5"/><rect x="820" y="137" width="340" height="7" fill="#059669"/><text x="840" y="209" font-size="50" font-weight="bold" fill="#059669">90</text><text x="930" y="205" font-size="21" font-weight="bold" fill="#14283F">Días propuestos</text><rect x="40" y="300" width="340" height="255" rx="12" fill="#FFFFFF" stroke="#D7E0E5"/><rect x="40" y="300" width="340" height="62" rx="12" fill="#DC3545"/><rect x="40" y="348" width="340" height="14" fill="#DC3545"/><text x="60" y="328" font-size="17" font-weight="bold" fill="white">DÍAS 1–30</text><text x="60" y="352" font-size="22" font-weight="bold" fill="white">Prioridad crítica</text><text x="60" y="396" font-size="19" fill="#14283F">R-001  Protección de cuentas</text><text x="60" y="431" font-size="19" fill="#14283F">R-002  Recuperación de datos</text><rect x="430" y="300" width="340" height="255" rx="12" fill="#FFFFFF" stroke="#D7E0E5"/><rect x="430" y="300" width="340" height="62" rx="12" fill="#E5A000"/><rect x="430" y="348" width="340" height="14" fill="#E5A000"/><text x="450" y="328" font-size="17" font-weight="bold" fill="#14283F">DÍAS 31–60</text><text x="450" y="352" font-size="22" font-weight="bold" fill="#14283F">Prioridad alta</text><text x="450" y="396" font-size="19" fill="#14283F">R-003  Seguridad de endpoints</text><text x="450" y="431" font-size="19" fill="#14283F">R-004  Fraude por correo</text><text x="450" y="466" font-size="19" fill="#14283F">R-005  Acceso a documentos</text><text x="450" y="501" font-size="19" fill="#14283F">R-006  Acceso VPN</text><rect x="820" y="300" width="340" height="255" rx="12" fill="#FFFFFF" stroke="#D7E0E5"/><rect x="820" y="300" width="340" height="62" rx="12" fill="#059669"/><rect x="820" y="348" width="340" height="14" fill="#059669"/><text x="840" y="328" font-size="17" font-weight="bold" fill="white">DÍAS 61–90</text><text x="840" y="352" font-size="22" font-weight="bold" fill="white">Prioridad moderada</text><text x="840" y="396" font-size="19" fill="#14283F">R-007  Gestión de parches</text><text x="840" y="431" font-size="19" fill="#14283F">R-008  Continuidad de archivos</text><rect x="40" y="576" width="1120" height="54" rx="9" fill="#E4EFEA"/><text x="60" y="609" font-size="21" fill="#14283F" font-weight="bold">Propuesto → Aprobado → Implementado → Verificado → Revisión</text><rect y="648" width="1200" height="52" fill="#E6EEEC"/><text x="42" y="681" font-size="18" fill="#37544C">Plazos desde aprobación (día 0). No se implementaron ni validaron controles.</text></g></svg>