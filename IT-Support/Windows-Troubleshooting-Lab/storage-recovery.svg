<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">Recuperación verificada de almacenamiento en Windows</title>
<desc id="svg-desc">La capacidad libre del volumen C aumentó de 18,6 GiB a 63,1 GiB tras el proceso de resolución. No se confirmó una causa raíz única.</desc><rect width="1100" height="460" fill="#F5F7F8"/><rect width="1100" height="100" fill="#14283F"/><rect width="12" height="100" fill="#059669"/><g font-family="Arial"><text x="36" y="38" fill="#A7F3D0" font-size="17">INC-001 / DIAGNÓSTICO REAL DE WINDOWS</text><text x="36" y="78" fill="white" font-size="32" font-weight="bold">Recuperación de espacio</text><text x="48" y="150" fill="#14283F" font-size="23" font-weight="bold">Espacio disponible en C:</text><text x="48" y="201" fill="#14283F" font-size="21">Antes</text><rect x="175" y="175" width="730" height="42" rx="8" fill="#DFE7EB"/><rect x="175" y="175" width="95" height="42" rx="8" fill="#DC3545"/><text x="925" y="204" fill="#14283F" font-size="23" font-weight="bold">18,6 GiB</text><text x="48" y="285" fill="#14283F" font-size="21">Después</text><rect x="175" y="259" width="730" height="42" rx="8" fill="#DFE7EB"/><rect x="175" y="259" width="323" height="42" rx="8" fill="#059669"/><text x="925" y="288" fill="#14283F" font-size="23" font-weight="bold">63,1 GiB</text><text x="175" y="342" fill="#64748B" font-size="19">3,9 % a 13,3 % libre / volumen de 475,9 GiB</text><rect x="48" y="374" width="1004" height="65" rx="9" fill="#E1F4E9"/><text x="70" y="403" fill="#065F46" font-size="23" font-weight="bold">+44,5 GiB recuperados</text><text x="70" y="426" fill="#37544C" font-size="16">Actualizaciones correctas tras limpieza y reinicio; causa raíz no confirmada.</text></g></svg>